<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#24120a">
<title>Waffle Drop Café</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;background:#24120a}
body{
  background:radial-gradient(ellipse at 50% 40%,#4a2514 0%,#24120a 75%);
  font-family:"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif}
#stage{position:fixed;top:env(safe-area-inset-top,0px);right:env(safe-area-inset-right,0px);bottom:env(safe-area-inset-bottom,0px);left:env(safe-area-inset-left,0px);display:flex;align-items:center;justify-content:center}
#wrap{position:relative;flex:none;width:300px;height:169px;border-radius:22px;overflow:hidden;background:#6b3a20;
  box-shadow:0 10px 40px rgba(0,0,0,.55),0 0 0 2px rgba(255,214,150,.12)}
#wrap::after{content:"";position:absolute;inset:0;border:4px solid #2a1408;border-radius:22px;pointer-events:none}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
</style>
</head>
<body>
<div id="stage"><div id="wrap"><canvas id="c"></canvas></div></div>
<script>
(() => {
'use strict';

/* ================= CONSTANTES ================= */
let W = 1100, H = 619;            // resolución lógica (horizontal 1100x619, vertical 620xN)
let PORTRAIT = false;
const TH = 36;                    // grosor de cada waffle
let HOLD_Y = 238;                 // posición (pantalla) del waffle en la garra
let BASE_W = 190;                 // ancho inicial
let PX = 550;                     // centro de la torre
let PY = 528;                     // centro del plato
let BASE_Y = 490;                 // y de la cara superior del primer waffle
let CAM_LINE = 410;               // altura a la que se mantiene la cima de la torre
let MARGIN = 140;                 // margen del recorrido de la garra
let SPD = 1;                      // escala de velocidad según ancho
const GRAV = 2200;
const FONT = '"Arial Rounded MT Bold","Nunito","Trebuchet MS","Segoe UI",Helvetica,Arial,sans-serif';
const TAU = Math.PI * 2;

const stage = document.getElementById('stage');
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const wrap = document.getElementById('wrap');
let sc = 1;

/* ================= UTILIDADES ================= */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function rnd(seed) {
  let t = (seed | 0) + 0x6D2B79F5;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function easeOutBack(t) { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }
function rr(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function makeLayer(w, h, s) {
  const c = document.createElement('canvas');
  c.width = Math.round(w * s); c.height = Math.round(h * s);
  const g = c.getContext('2d'); g.scale(s, s);
  return { c, g };
}
function txt(c, s, x, y, size, fill, stroke, lw, align) {
  c.font = '900 ' + size + 'px ' + FONT;
  c.textAlign = align || 'center'; c.textBaseline = 'middle'; c.lineJoin = 'round';
  if (stroke) { c.lineWidth = lw; c.strokeStyle = stroke; c.strokeText(s, x, y); }
  c.fillStyle = fill; c.fillText(s, x, y);
}
function star(c, x, y, r, rot) {
  c.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = rot + i * Math.PI / 5 - Math.PI / 2, rad = i % 2 ? r * 0.45 : r;
    c.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad);
  }
  c.closePath();
}

/* ================= RESIZE ================= */
function resize() {
  const aw = Math.max(200, stage.clientWidth - 12), ah = Math.max(200, stage.clientHeight - 12);
  const portrait = ah > aw;
  let nw, nh, cw, ch;
  if (!portrait) { nw = 1100; nh = 619; cw = Math.min(aw, 1100, ah * 16 / 9); ch = cw * 9 / 16; }
  else {
    nw = 620; nh = clamp(Math.round(620 * ah / aw / 20) * 20, 820, 1180);
    cw = Math.min(aw, ah * nw / nh, 760); ch = cw * nh / nw;
  }
  wrap.style.width = Math.round(cw) + 'px'; wrap.style.height = Math.round(ch) + 'px';
  const dpr = window.devicePixelRatio || 1;
  const maxPx = portrait ? 1000 : 1650;
  const px = Math.max(360, Math.min(Math.round(cw * dpr), maxPx));
  cv.width = px; cv.height = Math.round(px * nh / nw); sc = px / nw;
  if (nw !== W || nh !== H || !bg) applyLayout(nw, nh);
}
let rzT = 0;
function queueResize() { cancelAnimationFrame(rzT); rzT = requestAnimationFrame(resize); }
window.addEventListener('resize', queueResize);
window.addEventListener('orientationchange', () => setTimeout(queueResize, 120));
if (window.visualViewport) window.visualViewport.addEventListener('resize', queueResize);

/* ================= AUDIO ================= */
let ac = null, master = null, noiseBuf = null, muted = false;
try { muted = localStorage.getItem('wdc_muted') === '1'; } catch (e) {}
function ensureAudio() {
  try {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ac = new AC(); master = ac.createGain(); master.gain.value = 0.55; master.connect(ac.destination);
      const b = ac.createBuffer(1, 1, 22050), s = ac.createBufferSource();
      s.buffer = b; s.connect(ac.destination); s.start(0);
      noiseBuf = ac.createBuffer(1, Math.floor(ac.sampleRate * 0.15), ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ac.state === 'suspended') ac.resume();
  } catch (e) {}
}
function tone(f, f2, d, type, v, delay) {
  if (!ac || muted) return;
  try {
    const o = ac.createOscillator(), g = ac.createGain(), t0 = ac.currentTime + (delay || 0);
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t0);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + d);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(v, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + d + 0.03);
  } catch (e) {}
}
function noise(v, d, freq) {
  if (!ac || muted || !noiseBuf) return;
  try {
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(), t0 = ac.currentTime;
    s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.value = freq || 900;
    g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    s.connect(f); f.connect(g); g.connect(master); s.start(t0); s.stop(t0 + d + 0.02);
  } catch (e) {}
}
const sfx = {
  release() { tone(640, 300, 0.1, 'triangle', 0.14); },
  land() { tone(190, 70, 0.14, 'sine', 0.38); noise(0.18, 0.08, 700); },
  cut() { tone(320, 140, 0.12, 'square', 0.05, 0.03); },
  perfect() { [660, 880, 1175, 1568].forEach((f, i) => tone(f, null, 0.2, 'triangle', 0.15, i * 0.07)); },
  over() { tone(400, 70, 0.85, 'sawtooth', 0.16); tone(200, 50, 0.95, 'square', 0.09, 0.1); noise(0.2, 0.4, 500); }
};
function toggleSound() {
  muted = !muted;
  try { localStorage.setItem('wdc_muted', muted ? '1' : '0'); } catch (e) {}
  if (!muted) { ensureAudio(); tone(660, 880, 0.1, 'triangle', 0.12); }
}

/* ================= FONDO (pre-render, desenfocado) ================= */
let bg = null, table = null;

let cordTop = -110;
function lamp(g, x, y, s) {
  const gl = g.createRadialGradient(x, y + 30 * s, 5, x, y + 30 * s, 110 * s);
  gl.addColorStop(0, 'rgba(255,232,150,.75)'); gl.addColorStop(1, 'rgba(255,232,150,0)');
  g.fillStyle = gl; g.fillRect(x - 120 * s, y - 80 * s, 240 * s, 240 * s);
  g.strokeStyle = '#4a2b18'; g.lineWidth = 3; g.beginPath(); g.moveTo(x, cordTop); g.lineTo(x, y - 8 * s); g.stroke();
  g.fillStyle = '#f4cf78'; g.beginPath(); g.moveTo(x - 36 * s, y + 32 * s);
  g.quadraticCurveTo(x - 32 * s, y - 8 * s, x, y - 10 * s); g.quadraticCurveTo(x + 32 * s, y - 8 * s, x + 36 * s, y + 32 * s);
  g.closePath(); g.fill();
  g.fillStyle = '#fff6c8'; g.beginPath(); g.ellipse(x, y + 32 * s, 30 * s, 8 * s, 0, 0, TAU); g.fill();
}
function leafPlant(g, x, y, len, cols, n) {
  for (let i = 0; i < n; i++) {
    const a = -Math.PI / 2 + (i - (n - 1) / 2) * (2.3 / n) + Math.sin(i * 7) * 0.12;
    g.save(); g.translate(x, y); g.rotate(a + Math.PI / 2);
    g.fillStyle = cols[i % cols.length];
    g.beginPath(); g.ellipse(0, -len * 0.55, len * 0.17, len * 0.55, 0, 0, TAU); g.fill();
    g.restore();
  }
}
function person(g, x, y, hair, shirt, skin) {
  g.fillStyle = shirt; rr(g, x - 46, y + 34, 92, 120, 28); g.fill();
  g.fillStyle = hair; g.beginPath(); g.arc(x, y - 4, 34, 0, TAU); g.fill();
  g.fillStyle = skin; g.beginPath(); g.arc(x + 2, y + 6, 27, 0, TAU); g.fill();
}
function buildBG() {
  const SW = 1100, SH = 619;
  const BH = H + 110;
  const S = makeLayer(W, BH, 0.36), g = S.g;
  const tx = PORTRAIT ? W / 2 - 640 : 0, ty = 110 + (H - 619), topY = -ty;
  cordTop = topY;
  g.translate(tx, ty);
  let gr = g.createLinearGradient(0, topY, 0, 480);
  gr.addColorStop(0, '#ecc79e'); gr.addColorStop(1, '#c58b5c');
  g.fillStyle = gr; g.fillRect(0, topY, SW, 490 - topY);
  g.fillStyle = '#8f9b6c'; g.fillRect(230, 100, 690, 300);
  g.fillStyle = 'rgba(60,70,40,.22)';
  for (let x = 250; x < 900; x += 70) g.fillRect(x, 100, 7, 300);
  g.fillStyle = '#7e8a5c'; g.fillRect(230, 100, 690, 14);
  g.fillStyle = '#e8c48f'; g.fillRect(300, 170, 80, 100);
  g.fillStyle = '#b57f4a'; g.fillRect(310, 180, 60, 80);
  g.fillStyle = '#d7b078'; g.fillRect(660, 190, 70, 90);
  // ventana derecha
  g.fillStyle = '#fff3c9'; g.fillRect(925, 30, 185, 385);
  g.fillStyle = '#c78f50'; g.fillRect(925, 30, 185, 10); g.fillRect(925, 405, 185, 12);
  g.fillRect(1008, 30, 9, 385); g.fillRect(925, 150, 185, 9); g.fillRect(925, 272, 185, 9);
  const wg = g.createRadialGradient(1010, 230, 10, 1010, 230, 300);
  wg.addColorStop(0, 'rgba(255,244,200,.8)'); wg.addColorStop(1, 'rgba(255,244,200,0)');
  g.fillStyle = wg; g.fillRect(700, -50, 420, 560);
  // zócalo madera
  g.fillStyle = '#8a4e2c'; g.fillRect(0, 395, SW, 75);
  g.fillStyle = '#ab683b'; g.fillRect(0, 392, SW, 10);
  g.fillStyle = 'rgba(50,20,8,.28)'; for (let x = 0; x < SW; x += 58) g.fillRect(x, 404, 4, 66);
  // suelo
  gr = g.createLinearGradient(0, 465, 0, SH); gr.addColorStop(0, '#74401f'); gr.addColorStop(1, '#4f2815');
  g.fillStyle = gr; g.fillRect(0, 465, SW, SH);
  // mostrador izquierdo
  g.fillStyle = '#5a3320'; g.fillRect(0, 170, 280, 14);
  g.fillStyle = '#6b3d26'; g.fillRect(0, 184, 270, 118);
  const mugs = ['#e9e1d6', '#d96b4a', '#7fb0c9', '#f0c660', '#e9e1d6'];
  for (let i = 0; i < 5; i++) { g.fillStyle = mugs[i]; rr(g, 14 + i * 50, 258, 34, 36, 8); g.fill(); g.fillRect(14 + i * 50, 224, 30, 4); g.fillRect(18 + i * 50, 200, 22, 24); }
  g.fillStyle = '#7a4527'; g.fillRect(0, 300, 380, 170);
  g.fillStyle = '#b07040'; g.fillRect(0, 296, 390, 14);
  g.fillStyle = '#9ca4ae'; rr(g, 40, 238, 120, 62, 8); g.fill();
  g.fillStyle = '#6d7684'; g.fillRect(52, 250, 28, 30); g.fillRect(100, 250, 40, 22);
  g.fillStyle = '#d8d1c4'; rr(g, 200, 262, 50, 36, 6); g.fill(); rr(g, 262, 272, 44, 26, 6); g.fill();
  // lámparas
  lamp(g, 210, 150, 1.0); lamp(g, 505, 170, 1.15); lamp(g, 790, 230, 1.0); lamp(g, 1055, 120, 1.5); lamp(g, 1000, 235, 1.1);
  if (PORTRAIT) {
    g.fillStyle = '#e9c48f'; g.fillRect(430, -230, 90, 120); g.fillRect(740, -330, 100, 130);
    g.fillStyle = '#b57f4a'; g.fillRect(440, -220, 70, 100); g.fillRect(750, -320, 80, 110);
    g.fillStyle = '#7b4426'; g.fillRect(560, -170, 220, 14);
    g.fillStyle = '#e9e1d6'; rr(g, 590, -200, 34, 30, 8); g.fill(); rr(g, 640, -196, 30, 26, 8); g.fill();
    leafPlant(g, 730, -170, 70, ['#4d8a3f', '#3a7a35', '#5a9a46'], 7);
    lamp(g, 440, -120, 1.1); lamp(g, 700, -40, 1.0); lamp(g, 560, -300, 1.2); lamp(g, 860, -210, 1.0); lamp(g, 360, -380, 1.0);
  }
  // plantas colgantes
  g.strokeStyle = '#4a2b18'; g.lineWidth = 3;
  g.beginPath(); g.moveTo(615, topY); g.lineTo(615, 270); g.stroke();
  g.beginPath(); g.moveTo(330, 240); g.lineTo(330, 300); g.stroke();
  leafPlant(g, 335, 330, 95, ['#4d8a3f', '#3a7a35', '#5a9a46'], 9);
  leafPlant(g, 720, 330, 110, ['#4d8a3f', '#3a7a35', '#5a9a46'], 9);
  g.fillStyle = '#a56a3a'; rr(g, 695, 325, 50, 28, 8); g.fill();
  g.fillStyle = '#a56a3a'; rr(g, 305, 320, 60, 30, 8); g.fill();
  // planta central de fondo
  leafPlant(g, 395, 430, 150, ['#4d8a3f', '#3c7c36', '#5f9a49'], 11);
  g.fillStyle = '#9a6a48'; rr(g, 355, 420, 80, 50, 10); g.fill();
  // mesa y silla traseras
  g.fillStyle = '#9c5f33'; g.fillRect(160, 425, 230, 14); g.fillRect(185, 439, 14, 70); g.fillRect(345, 439, 14, 70);
  g.fillStyle = '#7d4524'; rr(g, 440, 360, 70, 120, 12); g.fill(); g.fillRect(445, 470, 12, 60); g.fillRect(495, 470, 12, 60);
  // clientes
  g.fillStyle = '#9c5f33'; g.fillRect(1080 - 260, 440, 280, 16);
  g.fillStyle = '#7b4426'; rr(g, 1010, 330, 100, 220, 16); g.fill();
  person(g, 735, 310, '#3d3a3a', '#5a9aa6', '#e0b08a');
  person(g, 885, 305, '#b5532b', '#bda68b', '#efc4a0');
  person(g, 1040, 318, '#4e2a1a', '#a83a2e', '#d89d78');
  g.fillStyle = '#e9e1d6'; g.fillRect(930, 428, 28, 22);
  // planta primer plano izquierda
  leafPlant(g, 105, 520, 260, ['#3f8f3a', '#2f7a30', '#56a444', '#37852f'], 12);
  g.fillStyle = '#e1c5a8'; rr(g, 40, 520, 140, 110, 14); g.fill();
  g.fillStyle = '#c9a888'; g.fillRect(40, 520, 140, 14);
  // pizarra / cuadros
  g.fillStyle = '#3b2a22'; g.fillRect(560, 120, 90, 60);
  // ampliar (desenfoque)
  const B = makeLayer(W, BH, 1), bg2 = B.g;
  bg2.imageSmoothingEnabled = true; bg2.imageSmoothingQuality = 'high';
  bg2.drawImage(S.c, 0, 0, W, BH);
  const gy = BASE_Y - 50;
  let g2 = bg2.createRadialGradient(W / 2, gy, 60, W / 2, gy, 520);
  g2.addColorStop(0, 'rgba(255,225,160,.16)'); g2.addColorStop(1, 'rgba(255,225,160,0)');
  bg2.fillStyle = g2; bg2.fillRect(0, 0, W, BH);
  const vi = PORTRAIT ? W * 0.5 : H * 0.4, vo = PORTRAIT ? H * 0.72 : W * 0.66;
  g2 = bg2.createRadialGradient(W / 2, BH / 2, vi, W / 2, BH / 2, vo);
  g2.addColorStop(0, 'rgba(50,20,6,0)'); g2.addColorStop(1, 'rgba(50,20,6,.5)');
  bg2.fillStyle = g2; bg2.fillRect(0, 0, W, BH);
  bg2.fillStyle = 'rgba(255,200,120,.06)'; bg2.fillRect(0, 0, W, BH);
  return B;
}

function buildTable() {
  const T = makeLayer(W, 300, 1.5), g = T.g;
  g.translate(PX - 550, -430);
  g.lineJoin = 'round';
  // madera
  let gr = g.createLinearGradient(0, 440, 0, 730);
  gr.addColorStop(0, '#bb7b40'); gr.addColorStop(1, '#8a4d25');
  g.beginPath(); g.moveTo(290, 440); g.lineTo(810, 440); g.lineTo(1030, 730); g.lineTo(70, 730); g.closePath();
  g.fillStyle = gr; g.fill();
  g.strokeStyle = 'rgba(60,25,8,.5)'; g.lineWidth = 3;
  [0.2, 0.5, 0.8].forEach(t => { g.beginPath(); g.moveTo(290 + 520 * t, 440); g.lineTo(70 + 960 * t, 730); g.stroke(); });
  g.strokeStyle = 'rgba(70,30,10,.22)'; g.lineWidth = 1.5;
  for (let i = 0; i < 26; i++) { const t = rnd(i * 9 + 3), y = 450 + rnd(i * 5 + 1) * 270; const xl = 290 - (y - 440) * 0.75, xr = 810 + (y - 440) * 0.76; const a = xl + (xr - xl) * t; g.beginPath(); g.moveTo(a, y); g.lineTo(a + 40 + rnd(i) * 60, y + 2); g.stroke(); }
  g.beginPath(); g.moveTo(290, 440); g.lineTo(810, 440); g.lineTo(1030, 730); g.lineTo(70, 730); g.closePath();
  g.strokeStyle = '#3b1a0b'; g.lineWidth = 4; g.stroke();
  g.strokeStyle = '#e0a468'; g.lineWidth = 3; g.beginPath(); g.moveTo(296, 446); g.lineTo(804, 446); g.stroke();
  // mantel
  const TL = 340, TR = 760, BL = 150, BR = 950, Y0 = 452, Y1 = 730;
  g.save();
  g.beginPath(); g.moveTo(TL, Y0); g.lineTo(TR, Y0); g.lineTo(BR, Y1); g.lineTo(BL, Y1); g.closePath(); g.clip();
  const N = 10, M = 14;
  const yAt = t => Y0 + (Y1 - Y0) * (t * t * 0.55 + t * 0.45);
  const xl = y => TL + (BL - TL) * ((y - Y0) / (Y1 - Y0)), xr = y => TR + (BR - TR) * ((y - Y0) / (Y1 - Y0));
  for (let r = 0; r < N; r++) {
    const ya = yAt(r / N), yb = yAt((r + 1) / N);
    for (let i = 0; i < M; i++) {
      const xa0 = xl(ya) + (xr(ya) - xl(ya)) * i / M, xa1 = xl(ya) + (xr(ya) - xl(ya)) * (i + 1) / M;
      const xb0 = xl(yb) + (xr(yb) - xl(yb)) * i / M, xb1 = xl(yb) + (xr(yb) - xl(yb)) * (i + 1) / M;
      g.fillStyle = (r + i) % 2 ? '#fdf2ec' : '#e8505b';
      g.beginPath(); g.moveTo(xa0, ya); g.lineTo(xa1, ya); g.lineTo(xb1 + 0.6, yb + 0.6); g.lineTo(xb0 - 0.6, yb + 0.6); g.closePath(); g.fill();
    }
  }
  gr = g.createLinearGradient(0, Y0, 0, Y1); gr.addColorStop(0, 'rgba(255,230,190,.12)'); gr.addColorStop(1, 'rgba(90,20,20,.16)');
  g.fillStyle = gr; g.fillRect(0, Y0, 1100, Y1 - Y0);
  g.restore();
  g.beginPath(); g.moveTo(TL, Y0); g.lineTo(TR, Y0); g.lineTo(BR, Y1); g.lineTo(BL, Y1);
  g.strokeStyle = '#4a1c12'; g.lineWidth = 3.5; g.stroke();
  g.beginPath(); g.moveTo(TL, Y0); g.lineTo(TR, Y0); g.strokeStyle = '#4a1c12'; g.stroke();
  return T;
}

/* ================= DIBUJO DE WAFFLE ================= */
function drawWaffle(c, cx, y, w, o) {
  o = o || {};
  const rx = w / 2, ry = Math.max(5, w * 0.15), bot = y + TH, s = o.seed || 1;
  c.save(); c.lineJoin = 'round'; c.lineCap = 'round';
  // cuerpo
  c.beginPath(); c.moveTo(cx - rx, y); c.lineTo(cx - rx, bot);
  c.ellipse(cx, bot, rx, ry, 0, Math.PI, 0, true);
  c.lineTo(cx + rx, y); c.ellipse(cx, y, rx, ry, 0, 0, Math.PI, true); c.closePath();
  let g = c.createLinearGradient(0, y, 0, bot + ry);
  g.addColorStop(0, '#f2b64a'); g.addColorStop(0.55, '#d58c28'); g.addColorStop(1, '#a5601a');
  c.fillStyle = g; c.fill();
  g = c.createLinearGradient(cx - rx, 0, cx + rx, 0);
  g.addColorStop(0, 'rgba(70,30,5,.32)'); g.addColorStop(0.28, 'rgba(70,30,5,0)');

/* ================= UPDATE ================= */
function update(dt) {
  time += dt;
  const top = layers[layers.length - 1];
  camTarget = Math.max(0, CAM_LINE - top.y);
  camY += (camTarget - camY) * (1 - Math.exp(-3.5 * dt));
  shake *= Math.exp(-8 * dt); if (shake < 0.05) shake = 0;

  if (started) hintA = Math.max(0, hintA - dt * 3.5);
  for (const l of layers) l.bt += dt;

  if (state === 'swing' && held) {
    held.scale += (1 - held.scale) * Math.min(1, dt * 12);
    const speed = Math.min(250 + layers.length * 11, 690) * SPD;
    clawX += dir * speed * dt;
    if (clawX > W - MARGIN) { clawX = W - MARGIN; dir = -1; }
    if (clawX < MARGIN) { clawX = MARGIN; dir = 1; }
  } else if (state === 'drop' && drop) {
    drop.vy += GRAV * dt; drop.y += drop.vy * dt;
    const target = top.y - TH;
    if (drop.y >= target) {
      const ov = Math.min(drop.x + drop.w / 2, top.x + top.w / 2) - Math.max(drop.x - drop.w / 2, top.x - top.w / 2);
      if (ov >= 5) drop.y = target;
      land();
    }
  } else if (state === 'settle') {
    settleT -= dt;
    if (settleT < 0.2) openT = 0;
    if (settleT <= 0) { spawnHeld(layers[layers.length - 1].w); state = 'swing'; }
  } else if (state === 'collapse') {
    collT -= dt;
    if (collT <= 0) { state = 'over'; panelT = 0; }
  } else if (state === 'over') {
    panelT += dt; btnPulse += dt;
  }

  for (let i = pieces.length - 1; i >= 0; i--) {
    const p = pieces[i];
    if (p.delay > 0) { p.delay -= dt; continue; }
    p.vy += GRAV * dt; p.px += p.vx * dt; p.py += p.vy * dt; p.rot += p.vr * dt; p.life -= dt;
    if (p.life <= 0 || p.py + camY > H + 260) pieces.splice(i, 1);

    const p = parts[i]; p.life -= dt;
    if (p.life <= 0) continue;
    p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;

}

  const c = ctx; c.save(); c.translate(SND.x, SND.y);
  c.beginPath(); c.arc(0, 4, SND.r, 0, TAU); c.fillStyle = 'rgba(50,20,6,.45)'; c.fill();
  c.beginPath(); c.arc(0, 0, SND.r, 0, TAU);
  const g = c.createLinearGradient(0, -SND.r, 0, SND.r); g.addColorStop(0, '#fadfa8'); g.addColorStop(1, '#e0a050');
  c.fillStyle = g; c.fill(); c.lineWidth = 3.5; c.strokeStyle = '#4a2410'; c.stroke();
  c.fillStyle = '#4a2410'; c.beginPath(); c.moveTo(-9, -4); c.lineTo(-4, -4); c.lineTo(3, -10); c.lineTo(3, 10); c.lineTo(-4, 4); c.lineTo(-9, 4); c.closePath(); c.fill();
  c.strokeStyle = '#4a2410'; c.lineWidth = 2.6; c.lineCap = 'round';
  if (muted) { c.beginPath(); c.moveTo(8, -5); c.lineTo(15, 5); c.moveTo(15, -5); c.lineTo(8, 5); c.stroke(); }
  else { c.beginPath(); c.arc(3, 0, 8, -0.8, 0.8); c.stroke(); c.beginPath(); c.arc(3, 0, 13, -0.8, 0.8); c.stroke(); }
  c.restore();
}
function drawHUD() {
  const c = ctx;
  card(21, 17, 206, 56); card(W - 21 - 220, 17, 220, 56);
  c.save(); c.translate(21 + 103, 46); const s = 1 + 0.22 * Math.sin(scorePop * Math.PI); c.scale(s, s);
  txt(c, 'SCORE: ' + score, 0, 2, 30, '#fff', '#3b1a0b', 7); c.restore();
  crown(W - 21 - 220 + 40, 45);
  txt(c, 'BEST: ' + Math.max(best, score), W - 21 - 220 + 128, 47, 30, '#fff', '#3b1a0b', 7);
  drawSound();
}
function drawHint() {
  if (hintA <= 0) return;
  const c = ctx; c.save(); c.globalAlpha = hintA;
  const hx = clamp(clawX, 120, W - 120), by = Math.sin(time * 6) * 7;
  c.font = '80px ' + FONT; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText('☝️', hx, HOLD_Y + 100 + by);
  c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 4; c.lineCap = 'round';
  const ry = HOLD_Y + 50 + by * 0.6;
  c.beginPath(); c.moveTo(hx - 30, ry); c.lineTo(hx - 42, ry - 8); c.moveTo(hx + 30, ry); c.lineTo(hx + 42, ry - 8); c.stroke();
  txt(c, '¡TOCA PARA SOLTAR!', clamp(hx, 215, W - 215), HOLD_Y + 172, 32, '#fff', '#3b1a0b', 8);
  c.restore();
}
function panelGeom() { return { x: W / 2 - 150, y: H / 2 + 98, w: 300, h: 62 }; }
function drawOver() {
  const c = ctx, p = clamp(panelT / 0.45, 0, 1), k = easeOutBack(p);
  c.save(); c.fillStyle = 'rgba(30,12,5,' + (0.45 * p) + ')'; c.fillRect(0, 0, W, H);
  c.translate(W / 2, H / 2); c.scale(Math.max(0.01, k), Math.max(0.01, k)); c.globalAlpha = p;
  rr(c, -236, -166, 480, 350, 30); c.fillStyle = 'rgba(30,10,3,.5)'; c.fill();
  rr(c, -240, -175, 480, 350, 30);
  const g = c.createLinearGradient(0, -175, 0, 175); g.addColorStop(0, '#fbe3b0'); g.addColorStop(1, '#e8ad5c');
  c.fillStyle = g; c.fill(); c.lineWidth = 6; c.strokeStyle = '#4a2410'; c.stroke();
  rr(c, -230, -165, 460, 330, 24); c.lineWidth = 2.5; c.strokeStyle = 'rgba(255,248,224,.8)'; c.stroke();
  txt(c, '¡SE CAYÓ LA TORRE! 🧇', 0, -125, 31, '#fff', '#3b1a0b', 8);
  txt(c, 'PUNTAJE', 0, -78, 19, '#7a4a20');
  txt(c, String(score), 0, -34, 62, '#fff', '#3b1a0b', 10);
  txt(c, 'MEJOR', 0, 28, 19, '#7a4a20');
  txt(c, String(best), 0, 62, 42, '#ffe066', '#3b1a0b', 9);
  if (newRecord) { c.save(); c.translate(150, -38); c.rotate(0.2); txt(c, '¡NUEVO RÉCORD!', 0, 0, 17, '#fff', '#c0392b', 6); c.restore(); }
  const pulse = 1 + Math.sin(btnPulse * 5) * 0.025;
  c.save(); c.translate(0, 129); c.scale(pulse, pulse);
  rr(c, -150, -27, 300, 62, 20); c.fillStyle = 'rgba(30,10,3,.5)'; c.fill();
  rr(c, -150, -31, 300, 62, 20);
  const g2 = c.createLinearGradient(0, -31, 0, 31); g2.addColorStop(0, '#7fd36a'); g2.addColorStop(1, '#3c9a3c');
  c.fillStyle = g2; c.fill(); c.lineWidth = 5; c.strokeStyle = '#2a4a1a'; c.stroke();
  txt(c, 'VOLVER A JUGAR', 0, 1, 28, '#fff', '#1f4a1a', 7);
  c.restore();
  c.restore();
}

function render() {
  const c = ctx;
  c.setTransform(sc, 0, 0, sc, 0, 0);
  const par = Math.min(camY * 0.12, 110);
  c.drawImage(bg.c, 0, -110 + par, W, H + 110);

  const sx = shake ? (Math.random() - 0.5) * shake : 0, sy = shake ? (Math.random() - 0.5) * shake : 0;
  c.save(); c.translate(sx, camY + sy);
  c.drawImage(table.c, 0, PY - 98, W, 300);
  drawPlate(c);
  // sombra dinámica de la torre
  const topL = layers[layers.length - 1];
  c.fillStyle = 'rgba(70,20,10,.22)'; c.beginPath(); c.ellipse(PX + 10, PY + 12, Math.min(190, 70 + topL.w * 0.6), 22, 0, 0, TAU); c.fill();
  for (let i = 0; i < layers.length; i++) {
    const l = layers[i];
    if (l.y + camY > H + 80 || l.y + camY < -120) continue;
    drawLayer(c, l, i);
  }
  for (const p of pieces) {
    const a = clamp(p.life / 0.4, 0, 1); if (a <= 0) continue;
    c.save(); c.translate(p.px, p.py); c.rotate(p.rot); const s = 0.75 + 0.25 * a; c.scale(s, s); c.globalAlpha = a;
    c.beginPath(); c.rect(p.l - p.px, -300, p.r - p.l, 600); c.clip();
    drawWaffle(c, p.cx - p.px, -TH / 2, p.w, p);
    if (p.side) {
      const ex = (p.side < 0 ? p.r : p.l) - p.px;
      c.strokeStyle = '#4f2410'; c.lineWidth = 3.5; c.beginPath(); c.moveTo(ex, -TH / 2 - p.w * 0.15); c.lineTo(ex, TH / 2 + p.w * 0.15); c.stroke();
    }
    c.restore();
  }
  if (drop) {
    // sombra de caída
    const ty = topL.y - TH;
    c.fillStyle = 'rgba(60,20,8,.2)'; c.beginPath(); c.ellipse(drop.x, topL.y + Math.max(5, topL.w * 0.15) * 0.4, drop.w * 0.42, 6, 0, 0, TAU); c.fill();
    drawWaffle(c, drop.x, drop.y, drop.w, drop);
  }
  for (const p of parts) {
    const a = clamp(p.life / p.max, 0, 1); c.globalAlpha = a;
    if (p.t === 'dust') { c.fillStyle = 'rgba(255,244,222,.9)'; c.beginPath(); c.arc(p.x, p.y, p.s * (1.6 - a * 0.6), 0, TAU); c.fill(); }
    else if (p.t === 'spark') { c.fillStyle = '#ffd34d'; c.beginPath(); c.arc(p.x, p.y, p.s * (0.4 + a * 0.6), 0, TAU); c.fill(); }
    else if (p.t === 'star') { star(c, p.x, p.y, p.s * (0.5 + a * 0.5), p.rot); c.fillStyle = '#fff2a0'; c.fill(); c.lineWidth = 1.5; c.strokeStyle = '#d9930f'; c.stroke(); }
    else if (p.t === 'ring') { c.strokeStyle = '#ffe680'; c.lineWidth = 5 * a; c.beginPath(); c.ellipse(p.x, p.y, p.s + (1 - a) * 150, (p.s + (1 - a) * 150) * 0.28, 0, 0, TAU); c.stroke(); }
  }
  c.globalAlpha = 1;
  for (const f of floaters) {
    const k = f.big ? easeOutBack(Math.min(1, f.t / 0.25)) : 1, a = clamp((f.max - f.t) / 0.25, 0, 1);
    c.save(); c.globalAlpha = a; c.translate(f.x, f.y); c.scale(Math.max(0.01, k), Math.max(0.01, k));
    txt(c, f.text, 0, 0, f.size, f.color, '#3b1a0b', f.big ? 9 : 6); c.restore();
  }
  c.restore();

  // pantalla: garra + waffle sostenido
  if (state !== 'over' || true) {
    if (held) {
      c.save(); c.translate(clawX, HOLD_Y); c.scale(held.scale, held.scale);
      drawWaffle(c, 0, 0, held.w, held); c.restore();
    }
    drawClaw(c, clawX, held ? held.w * held.scale : lastW, open);
  }
  drawHUD();
  drawHint();
  if (state === 'over') drawOver();
}

/* ================= ENTRADA ================= */
function toLogical(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); ensureAudio();
  const p = toLogical(e);
  if (Math.hypot(p.x - SND.x, p.y - SND.y) < 34) { toggleSound(); return; }
  if (state === 'over') {
    const b = panelGeom();
    if (panelT > 0.5 && p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y - 8 && p.y <= b.y + b.h + 8) { resetGame(); }
    return;
  }
  release();
}, { passive: false });
document.addEventListener('pointerup', ensureAudio);
window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'Enter') {
    e.preventDefault(); if (e.repeat) return; ensureAudio();
    if (state === 'over') { if (panelT > 0.6) resetGame(); } else release();
  } else if (e.code === 'KeyM') toggleSound();
});
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

/* ================= BUCLE ================= */
let last = 0;
function frame(t) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.033, (t - last) / 1000 || 0.016); last = t;
  try { update(dt); render(); } catch (err) { console.error(err); }
}
resize();
resetGame();
requestAnimationFrame(frame);
})();
</script>
