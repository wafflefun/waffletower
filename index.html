<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!-- 🔧 TEXTOS: si cambias TITULO o SUBTITULO (más abajo, en el JavaScript), cámbialos también
     en estas dos líneas: son las que se ven al compartir el link y en los buscadores.
     OJO: la descripción dice "5 pruebas" y nombra cada una: si agregas o quitas pruebas
     (🔧 PRUEBAS), cámbiala aquí a mano (la página no la puede cambiar sola). -->
<title>Tu edad mental</title>
<meta name="description" content="5 pruebas rápidas de reflejos, memoria, vista, lógica y concentración para descubrir la edad de tu cerebro.">
<!--
=====================================================================
  🧠 TU EDAD MENTAL — GUÍA RÁPIDA PARA EDITAR
=====================================================================
  Todo el juego está en este único archivo (HTML + CSS + JavaScript).
  Para encontrar lo que quieres cambiar, busca (Ctrl+F) estas marcas:

   🔧 COLORES        → colores y fuentes de la página (en el CSS) y colores
                       de la imagen del resultado (COLORES_CARTA, en el JavaScript)
   🔧 CONFIG         → sonido, volumen, link para compartir, marca, récord
     ⏱️ TIEMPOS      → (dentro de CONFIG) cuenta regresiva, contador del
                       final, avisos, bloqueo del doble toque, segundo
                       toque del 🏠. Cada prueba tiene ADEMÁS sus propios
                       tiempos dentro de su sección (busca ⏱️).
   🔧 REFLEJOS       → rondas, cuánto dura el rojo, castigos por tocar antes
   🔧 MEMORIA        → largo inicial, vidas, cuánto se ilumina cada casilla
                       y los emojis de las casillas (EMOJIS_MEMORIA)
   🔧 VISTA          → tiempo, castigo por error, tamaño de la cuadrícula
                       y la lista de pares de emojis (PARES_VISTA)
   🔧 LÓGICA         → tiempo, cuánto restan los errores, las cuentas
                       automáticas y la lista de preguntas (PREGUNTAS_LOGICA)
   🔧 CONCENTRACIÓN  → tiempo y la lista de colores (COLORES_STROOP)
   🔧 PRUEBAS        → qué pruebas salen, en qué orden y cuánto pesa cada
                       una en la edad final. Tiene un paso a paso para
                       agregar una prueba nueva y un ejemplo listo para usar.
   🔧 EDADES         → cómo se convierte cada puntaje en años (explicado
                       con un ejemplo con números)
   🔧 RESULTADOS     → las frases del final según la edad ("un abuelo sabio")
   🔧 TEXTOS         → todos los demás textos que se ven en pantalla
   🔧 SONIDOS        → notas, duración y volumen de cada sonido
   🔧 CARTA          → la imagen de 1080 x 1350 que se descarga o comparte
   💡 IDEA           → cosas que se podrían agregar más adelante (cada idea
                       está escrita justo donde habría que programarla)

  OJO: las marcas LÓGICA y CONCENTRACIÓN llevan tilde: búscalas con tilde.
  Para ver todos los puntajes "excelente" y "malo" juntos, busca EXCELENTE.

  AYUDAS PARA PROBAR (se agregan al final de la dirección de la página):
   • ?prueba=memoria  → juega SÓLO esa prueba y muestra su resultado.
       Nombres posibles (sin tildes): reflejos, memoria, vista, logica,
       concentracion.  Ejemplo:  index.html?prueba=vista
   • ?rapido=1        → los tiempos se dividen por CONFIG.FACTOR_RAPIDO
       (4): sólo para probar rápido, las pruebas se vuelven rarísimas.
       NO se aceleran: el límite de "¡Muy lento!" de Reflejos (LIMITE)
       ni lo que dura el aviso de abajo (TIEMPO_AVISO).
   • Se pueden juntar:  index.html?prueba=logica&rapido=1
   • Con ?prueba= o ?rapido=1 NO se guarda el récord (así tus pruebas
     no cuentan como partidas de verdad).
   • Teclas: M = sonido. Reflejos: Espacio o Enter. Lógica y
     Concentración: 1, 2, 3 y 4 (para cambiarlas, busca alPresionarTecla).
     Memoria y Vista: con Tab se llega a la cuadrícula y con las flechas
     se mueve entre los emojis.
   • Si en medio de una prueba la persona cambia de pestaña o minimiza el
     navegador, el juego se pone en pausa solo ("Pausa — toca para
     seguir"): el reloj de la prueba se congela, la prueba se tapa (para
     que nadie busque con el reloj parado) y en Reflejos la ronda que iba
     se repite desde el principio.
   • Para que un doble toque no se salte las instrucciones, los botones de
     una pantalla recién aparecida no responden durante un ratito
     (CONFIG.BLOQUEO_TOQUE). Y el 🏠 de arriba pide un segundo toque si
     hay una partida a medias (CONFIG.TIEMPO_SALIR).

  Regla de oro: casi todo lo que se puede cambiar está en los objetos
  de configuración de arriba. Cada número tiene una nota que dice qué
  hace y en qué unidad está (ms = milésimas de segundo: 1000 ms = 1
  segundo; segundos; px = puntos de la pantalla).
=====================================================================
-->

<!-- Fuentes: "Bangers" (títulos estilo cómic) y "Nunito" (texto).
     🔧 COLORES: para cambiar de fuente, cambia el link y las variables
     --fuente-titulo / --fuente-texto más abajo. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:ital,wght@0,600;0,800;0,900;1,700&display=swap" rel="stylesheet">

<style>
  /* =================================================================
     🔧 COLORES de la página
     Cambia estos valores y toda la página cambia de color.
     (Las versiones transparentes, como el fondo verdoso de una respuesta
      correcta, se sacan solas de estos colores con color-mix(…): no hay
      que cambiarlas. La línea rgba(…) que va justo antes es sólo para
      navegadores muy antiguos.)
     (Los colores de la imagen que se descarga están en COLORES_CARTA,
      y los colores de la prueba de Concentración en COLORES_STROOP,
      los dos dentro del JavaScript más abajo)
     ================================================================= */
  :root {
    --fondo: #12061f;          /* color de fondo principal */
    --fondo-2: #2b0b45;        /* segundo color del degradado de fondo */
    --panel: rgba(255, 255, 255, 0.06);   /* fondo de las cajas */
    --borde: rgba(255, 255, 255, 0.14);   /* bordes de las cajas */
    --texto: #f6ecff;          /* texto principal */
    --texto-suave: #bda9d6;    /* texto secundario */
    --acento: #ff3b8d;         /* color de botones principales (rosado) */
    --acento-2: #8a5cff;       /* segundo color de acento (morado) */
    --ok: #3dffa8;             /* color de "bien" (respuestas correctas, barras jóvenes) */
    --peligro: #ff2d55;        /* color de "mal" (errores, poco tiempo, barras viejas) */
    --radio: 18px;             /* qué tan redondeadas son las esquinas */
    --fuente-titulo: "Bangers", "Impact", sans-serif;
    --fuente-texto: "Nunito", system-ui, sans-serif;
    /* Colores propios de este juego */
    --amarillo: #ffd23f;       /* barras "más o menos" e insignia del robot */
    --espera: #e0213f;         /* Reflejos: zona roja "Espera…" */
    --ya: #22d37a;             /* Reflejos: zona verde "¡YA!" */
    --ya-texto: #062b16;       /* Reflejos: letras sobre el verde */
    --pronto: #ff8a3d;         /* Reflejos: zona naranja "¡Muy pronto!" */
    --pronto-texto: #2a1200;   /* Reflejos: letras sobre el naranja */
    --encendida: #ffe066;      /* Memoria: casilla iluminada */
    --fuente-emoji: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  html { height: 100%; overscroll-behavior: none; }
  body {
    margin: 0;
    min-height: 100vh;
    color: var(--texto);
    font-family: var(--fuente-texto);
    background: radial-gradient(circle at 20% 0%, var(--fondo-2), var(--fondo) 60%) fixed;
    background-color: var(--fondo);
    overflow: hidden;              /* el juego cabe en la pantalla: nunca hay que bajar */
    overscroll-behavior: none;
  }

  /* La app ocupa exactamente el alto de la pantalla (100dvh = alto visible real en celulares).
     Márgenes: --margen-arriba / --margen-lados / --margen-abajo (en px). En iPhone acostado se
     agranda solo lo necesario para no meterse en la zona del "notch" ni en las esquinas
     redondeadas (eso es lo que hace env(safe-area-inset-…)). */
  .app {
    --margen-arriba: 10px;
    --margen-lados: 16px;
    --margen-abajo: 12px;
    max-width: 1100px;
    margin: 0 auto;
    padding: var(--margen-arriba) var(--margen-lados) var(--margen-abajo);
    padding:
      max(var(--margen-arriba), env(safe-area-inset-top))
      max(var(--margen-lados), env(safe-area-inset-right))
      max(var(--margen-abajo), env(safe-area-inset-bottom))
      max(var(--margen-lados), env(safe-area-inset-left));
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  /* ---------- Encabezado ---------- */
  header { text-align: center; flex: none; }
  header h1 {
    font-family: var(--fuente-titulo);
    font-weight: 400;
    font-size: clamp(2rem, 5.5vw, 3.2rem);
    line-height: 1.05;
    letter-spacing: 2px;
    margin: 0;
    color: #fff;
    text-shadow: 3px 3px 0 var(--acento), 6px 6px 0 var(--acento-2);
  }
  header p { margin: 4px 0 0; color: var(--texto-suave); font-weight: 700; font-size: 0.95rem; }

  /* ---------- Zona del juego (barra de progreso + pantallas) ---------- */
  .juego { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; gap: 8px; }

  /* HUD: la barra con el progreso de las 5 pruebas y los botones de sonido e inicio */
  .hud {
    flex: none;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px 6px 10px;
    background: var(--panel);
    border: 1px solid var(--borde);
    border-radius: var(--radio);
    font-weight: 800;
  }
  #btnCasa { margin-left: 6px; }   /* un poco más separado del 🔊 para no tocarlo sin querer */
  .pasos { flex: 1; min-width: 0; display: flex; gap: 6px; list-style: none; margin: 0; padding: 0; }
  .paso {
    flex: 1;
    min-width: 0;
    height: 32px;
    border-radius: 99px;
    background: rgba(255, 255, 255, 0.12);
    display: grid;
    place-items: center;
    font-size: 1.05rem;
    font-family: var(--fuente-emoji);
    transition: background 0.3s, box-shadow 0.3s;
  }
  .paso.hecho { background: var(--acento); }
  .paso.actual {
    background: var(--acento-2);
    box-shadow: 0 0 0 3px rgba(138, 92, 255, 0.35);                                /* (navegadores antiguos) */
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--acento-2) 35%, transparent);   /* el mismo color, transparente */
  }

  /* Aquí aparecen las pantallas (inicio, instrucciones, prueba, resultados…) */
  .zona { flex: 1 1 0; min-height: 0; position: relative; }

  /* ---------- Botones generales (iguales a "Crea tu Villano" y "No toques las paredes") ---------- */
  .btn {
    padding: 12px 18px;
    border-radius: 999px;
    border: 2px solid var(--borde);
    background: rgba(255, 255, 255, 0.06);
    color: var(--texto);
    font: 900 1rem var(--fuente-texto);
    cursor: pointer;
    transition: transform 0.12s, filter 0.2s;
    touch-action: manipulation;      /* en celular: sin zoom por doble toque */
  }
  .btn:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.15); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn.principal { background: var(--acento); border-color: var(--acento); color: #fff; }
  .btn.secundario { background: var(--acento-2); border-color: var(--acento-2); color: #fff; }
  .btn.grande { font-size: 1.15rem; padding: 14px 24px; }
  .btn.icono { padding: 6px 10px; font-size: 1.2rem; line-height: 1; min-width: 44px; min-height: 44px; }  /* 44 px = tamaño cómodo para el dedo */
  .btn:focus-visible, .opcion:focus-visible, .ficha:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }

  /* ---------- Pantallas ---------- */
  .pantalla {
    position: absolute;
    inset: 0;
    z-index: 3;
    display: flex;
    padding: 4px 0;
    overflow-y: auto;
    border-radius: 16px;
  }
  .tarjeta {
    margin: auto;
    width: min(100%, 480px);
    text-align: center;
    padding: 18px 18px 20px;
    border-radius: var(--radio);
    border: 1px solid var(--borde);
    background: linear-gradient(var(--panel), var(--panel)), var(--fondo);
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
  }
  .tarjeta h2 {
    font-family: var(--fuente-titulo);
    font-weight: 400;
    font-size: clamp(1.7rem, 5vw, 2.5rem);
    letter-spacing: 1px;
    margin: 0 0 8px;
  }
  .tarjeta p { margin: 6px 0; }
  .record { color: var(--texto-suave); font-weight: 800; }
  .atajos { color: var(--texto-suave); font-size: 0.85rem; }
  .titulo-compacto { display: none; }   /* el título dentro de la tarjeta: sólo en celular acostado (ver más abajo) */
  .sub { color: var(--texto-suave); font-weight: 800; }
  .acciones { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 14px; }
  .nuevo-record { color: var(--ok); font-weight: 900; font-size: 1.15rem; }
  .paso-num { color: var(--texto-suave); font-weight: 800; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; margin: 0 0 4px; }
  .emoji-grande { font-family: var(--fuente-emoji); font-size: clamp(3rem, 12vw, 4.4rem); line-height: 1.15; display: inline-block; animation: flotar 2.4s ease-in-out infinite; }
  @keyframes flotar { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

  /* Lista de las 5 pruebas en la pantalla de inicio */
  .lista-pruebas { list-style: none; padding: 0; margin: 4px 0 14px; text-align: left; display: grid; gap: 6px; }
  .lista-pruebas li {
    display: flex; align-items: center; gap: 10px;
    background: rgba(255, 255, 255, 0.05); border-radius: 12px; padding: 6px 12px;
  }
  .lista-pruebas .emo { font-family: var(--fuente-emoji); font-size: 1.5rem; line-height: 1; flex: none; }
  .lista-pruebas b { display: block; font-weight: 900; line-height: 1.15; }
  .lista-pruebas small { display: block; color: var(--texto-suave); font-weight: 700; font-size: 0.82rem; line-height: 1.2; }
  /* Empezar, récord y sonido, uno debajo del otro (con el celular acostado van en una fila: ver más abajo) */
  .fila-inicio { display: flex; flex-direction: column; align-items: center; }

  /* Tarjeta de instrucciones de cada prueba */
  .mide { color: var(--ok); font-weight: 900; }
  .instruccion { font-weight: 800; font-size: 1.05rem; line-height: 1.35; background: rgba(255, 255, 255, 0.05); border-radius: 12px; padding: 10px 12px; }
  .tarjeta .instruccion { margin: 10px 0 12px; }

  /* Cuenta regresiva 3-2-1 */
  .cuenta { margin: auto; text-align: center; }
  .cuenta-prueba { font-weight: 900; color: var(--texto-suave); font-size: 1.1rem; margin: 0; }
  .cuenta-numero {
    display: block;
    font: 400 clamp(6rem, 30vw, 11rem)/1 var(--fuente-titulo);
    color: #fff;
    text-shadow: 4px 4px 0 var(--acento), 8px 8px 0 var(--acento-2);
  }
  .cuenta-numero.pop { animation: pop 0.5s cubic-bezier(.2, 1.6, .4, 1); }
  @keyframes pop { from { transform: scale(0.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  /* Resultado de una prueba */
  .res-linea { font: 900 clamp(1.25rem, 4.6vw, 1.6rem)/1.25 var(--fuente-texto); margin: 6px 0 2px !important; }
  .res-detalle { color: var(--texto-suave); font-weight: 800; font-size: 0.92rem; }
  .chip-edad {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin: 8px 0 2px;
    padding: 6px 18px;
    border-radius: 999px;
    color: #fff;
    background: linear-gradient(90deg, var(--acento), var(--acento-2));
    font: 400 1.7rem var(--fuente-titulo);
    letter-spacing: 1px;
  }

  /* ---------- El tablero de cada prueba ---------- */
  /* user-select / touch-callout: al dejar el dedo apoyado no se selecciona texto ni sale
     el menú "Copiar / Compartir" del celular encima de la prueba */
  .pantalla-prueba { padding: 0; overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  /* En pausa la prueba se tapa: así nadie busca el emoji diferente con el reloj detenido */
  .tablero.en-pausa .area-prueba { visibility: hidden; }
  .tablero {
    position: relative;
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 10px 12px 12px;
    background: var(--panel);
    border: 1px solid var(--borde);
    border-radius: var(--radio);
    min-height: 0;
    outline: none;
  }
  .tablero-barra { flex: none; display: flex; align-items: center; flex-wrap: wrap; gap: 4px 14px; min-height: 30px; }
  .tablero-barra b { font: 400 1.45rem/1.1 var(--fuente-titulo); letter-spacing: 1px; margin-right: auto; white-space: nowrap; }
  .tablero-barra span { font-weight: 900; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .barra-tiempo { flex: none; height: 10px; border-radius: 99px; background: rgba(255, 255, 255, 0.12); overflow: hidden; }
  .barra-tiempo span { display: block; height: 100%; width: 100%; border-radius: inherit; background: var(--ok); }
  .barra-tiempo.poco span { background: var(--peligro); }
  .tiempo-poco { color: var(--peligro); }
  .area-prueba { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
  .mensaje-prueba { flex: none; margin: 0; text-align: center; font-weight: 900; font-size: 1.08rem; min-height: 1.4em; }

  /* Sello "¡Tiempo!" / "¡Listo!" que aparece al terminar una prueba */
  .sello {
    position: absolute; left: 50%; top: 50%; z-index: 4;
    transform: translate(-50%, -50%) rotate(-6deg);
    padding: 8px 26px; border-radius: 16px;
    background: var(--acento); color: #fff;
    font: 400 clamp(2.2rem, 9vw, 3.6rem) var(--fuente-titulo); letter-spacing: 2px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
    pointer-events: none;
    white-space: nowrap;
  }

  /* Destello rojo cuando te equivocas */
  .destello { position: absolute; inset: 0; z-index: 3; border-radius: var(--radio); background: var(--peligro); opacity: 0; pointer-events: none; }
  .destello.activo { animation: destello 0.4s ease-out; }
  @keyframes destello { from { opacity: 0.45; } to { opacity: 0; } }

  /* Algo tiembla cuando te equivocas */
  .temblando { animation: temblar 0.4s; }
  @keyframes temblar {
    0%, 100% { transform: translate(0, 0); }
    20% { transform: translate(-8px, 3px); }
    40% { transform: translate(7px, -4px); }
    60% { transform: translate(-5px, -2px); }
    80% { transform: translate(4px, 3px); }
  }

  /* ---------- ⚡ Reflejos ---------- */
  .zona-reflejos {
    flex: 1 1 0;
    min-height: 140px;
    border-radius: 16px;
    border: 2px solid var(--borde);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    text-align: center;
    padding: 12px;
    cursor: pointer;
    touch-action: none;              /* en celular: el toque es para el juego, no para mover la página */
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    outline: none;
  }
  .zr-grande { font: 400 clamp(2.6rem, 11vw, 5rem)/1 var(--fuente-titulo); letter-spacing: 2px; }
  .zr-chica { font-weight: 900; font-size: 1.05rem; }
  .zona-reflejos.entre { background: rgba(255, 255, 255, 0.05); }
  .zona-reflejos.espera { background: var(--espera); border-color: transparent; color: #fff; }
  .zona-reflejos.ya { background: var(--ya); border-color: transparent; color: var(--ya-texto); }
  .zona-reflejos.pronto { background: var(--pronto); border-color: transparent; color: var(--pronto-texto); }
  .rondas { flex: none; list-style: none; margin: 0; padding: 0; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .rondas li { padding: 6px 12px; border-radius: 99px; background: rgba(255, 255, 255, 0.08); font-weight: 900; font-variant-numeric: tabular-nums; }
  .rondas li.actual { box-shadow: inset 0 0 0 2px var(--acento-2); }
  .rondas li.castigo { color: var(--peligro); }

  /* ---------- 🧩 Memoria y 👀 Vista: cuadrícula de emojis ---------- */
  /* La caja mide lo que sobra de pantalla y la cuadrícula es el cuadrado más grande que cabe ahí */
  .caja-cuadricula { flex: 1 1 0; min-height: 0; display: grid; place-items: center; position: relative; container-type: size; }
  .cuadricula {
    --columnas: 3;
    width: 300px; height: 300px;                          /* (navegadores antiguos) */
    width: min(100cqw, 100cqh); height: min(100cqw, 100cqh);
    display: grid;
    grid-template-columns: repeat(var(--columnas), minmax(0, 1fr));
    grid-template-rows: repeat(var(--columnas), minmax(0, 1fr));
    gap: 8px;
    gap: calc(min(100cqw, 100cqh) * 0.022);
  }
  .ficha {
    display: grid;
    place-items: center;
    min-width: 0;
    min-height: 0;
    padding: 0;
    border-radius: 14%;
    border: 2px solid var(--borde);
    background: rgba(255, 255, 255, 0.07);
    color: var(--texto);
    font-family: var(--fuente-emoji);
    font-size: 2rem;
    font-size: calc(min(100cqw, 100cqh) / var(--columnas) * 0.52);
    line-height: 1;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    transition: background 0.15s, transform 0.15s, box-shadow 0.15s;
  }
  .ficha.encendida {
    background: var(--encendida);
    border-color: #fff;
    box-shadow: 0 0 0 4px rgba(255, 224, 102, 0.35), 0 0 28px rgba(255, 224, 102, 0.7);
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--encendida) 35%, transparent), 0 0 28px color-mix(in srgb, var(--encendida) 70%, transparent);
    transform: scale(1.06);
  }
  .ficha.tocada { animation: tocada 0.25s; }
  @keyframes tocada { from { background: var(--acento-2); transform: scale(0.93); } }
  .ficha.bien { background: rgba(61, 255, 168, 0.3); background: color-mix(in srgb, var(--ok) 30%, transparent); border-color: var(--ok); }
  .ficha.mal { background: rgba(255, 45, 85, 0.3); background: color-mix(in srgb, var(--peligro) 30%, transparent); border-color: var(--peligro); }
  /* "−2 s" que sube y desaparece al equivocarte en Vista */
  .flotante {
    position: absolute; left: 50%; top: 40%; z-index: 2;
    transform: translate(-50%, 0);
    font: 400 2.6rem var(--fuente-titulo); color: var(--peligro);
    text-shadow: 0 2px 0 #000, 0 0 12px rgba(0, 0, 0, 0.6);
    pointer-events: none; opacity: 0;
  }
  .flotante.activo { animation: subir 0.9s ease-out; }
  @keyframes subir { from { opacity: 1; transform: translate(-50%, 0); } to { opacity: 0; transform: translate(-50%, -50px); } }

  /* ---------- 🧮 Lógica y 🎨 Concentración: botones de respuesta ---------- */
  .caja-pregunta { flex: 1 1 auto; min-height: 0; display: grid; place-items: center; padding: 0 4px; }
  .pregunta { margin: 0; text-align: center; font: 900 clamp(1.2rem, 4.6vw, 1.85rem)/1.3 var(--fuente-texto); }
  .opciones { flex: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .opcion {
    position: relative;
    min-height: 62px;
    padding: 10px 12px;
    border-radius: 14px;
    border: 2px solid var(--borde);
    background: rgba(255, 255, 255, 0.06);
    color: var(--texto);
    font: 800 1.12rem/1.2 var(--fuente-texto);
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-align: center;
    transition: border-color 0.15s, background 0.15s;
  }
  .opcion .num { position: absolute; top: 5px; left: 9px; font-size: 0.72rem; font-weight: 900; color: var(--texto-suave); }
  .opcion.bien { border-color: var(--ok); background: rgba(61, 255, 168, 0.2); background: color-mix(in srgb, var(--ok) 20%, transparent); }
  .opcion.mal { border-color: var(--peligro); background: rgba(255, 45, 85, 0.22); background: color-mix(in srgb, var(--peligro) 22%, transparent); }
  .muestra { width: 22px; height: 22px; border-radius: 50%; flex: none; border: 2px solid rgba(255, 255, 255, 0.5); }
  .caja-palabra { flex: 1 1 auto; min-height: 0; display: grid; place-items: center; }
  .palabra {
    font: 400 clamp(3.4rem, 16vw, 6.5rem)/1 var(--fuente-titulo);
    letter-spacing: 3px;
    text-shadow: 0 4px 0 rgba(0, 0, 0, 0.45);
  }
  .nueva { animation: aparecer 0.2s ease-out; }
  @keyframes aparecer { from { opacity: 0.2; transform: scale(0.94); } to { opacity: 1; transform: scale(1); } }
  @media (hover: hover) {
    .opcion:hover { border-color: var(--acento-2); }
    .ficha:hover { border-color: var(--acento-2); }
  }

  /* ---------- Pausa (aparece encima de la prueba) ---------- */
  .pantalla.pausa { z-index: 6; padding: 12px; background: rgba(12, 4, 22, 0.88); cursor: pointer; }

  /* ---------- Resultado final ---------- */
  .tarjeta.final { width: min(100%, 920px); padding: 16px 18px 18px; }
  .final-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 26px; align-items: center; }
  .etiqueta { display: block; color: var(--texto-suave); font-weight: 800; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; }
  .edad-grande {
    font: 400 clamp(4.4rem, 15vw, 7.2rem)/0.95 var(--fuente-titulo);
    color: #fff;
    letter-spacing: 2px;
    text-shadow: 4px 4px 0 var(--acento), 8px 8px 0 var(--acento-2);
    font-variant-numeric: tabular-nums;
    margin: 4px 0 6px;
  }
  .edad-grande small { font-size: 0.34em; margin-left: 8px; letter-spacing: 1px; text-shadow: 2px 2px 0 var(--acento); }
  .frase-final { font-weight: 900; font-size: 1.2rem; line-height: 1.3; }
  .descripcion { color: var(--texto-suave); font-weight: 700; }
  .insignia {
    display: inline-block; margin: 6px 4px 0 !important; padding: 4px 14px; border-radius: 999px;
    background: var(--amarillo); color: #1a0b2e; font-weight: 900;
  }
  .desglose { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
  .fila { display: grid; grid-template-columns: minmax(0, 9em) minmax(0, 1fr) 2.4em; align-items: center; gap: 10px; text-align: left; }
  .fila-nombre { font-weight: 900; line-height: 1.15; min-width: 0; white-space: nowrap; }
  .fila-nombre small { display: block; color: var(--texto-suave); font-weight: 700; font-size: 0.8rem; }
  .fila-barra { height: 14px; border-radius: 99px; background: rgba(255, 255, 255, 0.12); overflow: hidden; }
  .fila-barra span { display: block; height: 100%; width: 0; border-radius: inherit; transition: width 0.9s cubic-bezier(.2, .8, .2, 1); }
  .revelado .fila-barra span { width: var(--ancho); }
  .fila-barra .buena { background: var(--ok); }
  .fila-barra .media { background: var(--amarillo); }
  .fila-barra .mala { background: var(--peligro); }
  .fila-edad { font: 400 1.55rem/1 var(--fuente-titulo); text-align: right; letter-spacing: 1px; }
  .poderes { display: grid; gap: 4px; margin-top: 10px !important; font-weight: 900; text-align: left; }
  /* Los botones del final quedan SIEMPRE a la vista, pegados abajo: si el resultado no cabe en la
     pantalla (celular chico o acostado), lo de arriba se desliza por detrás de ellos.
     El fondo es el mismo color de la tarjeta (--fondo con un 6 % de blanco), con un degradado arriba. */
  .final .acciones .btn { min-height: 44px; }
  .texto-corto { display: none; }
  .tarjeta.final .acciones {
    position: sticky;
    bottom: 0;
    z-index: 1;
    margin: 6px -18px -18px;
    padding: 18px 18px 14px;
    border-radius: 0 0 var(--radio) var(--radio);
    background: var(--fondo);
    background: linear-gradient(transparent, color-mix(in srgb, var(--fondo) 94%, #fff) 16px);
  }
  .revelable { opacity: 0; transform: translateY(8px); transition: opacity 0.5s, transform 0.5s; }
  .revelado .revelable { opacity: 1; transform: none; }

  /* ---------- Aviso flotante (toast) ---------- */
  .aviso {
    position: fixed;
    left: 50%;
    bottom: 24px;
    bottom: calc(24px + env(safe-area-inset-bottom));   /* sobre la barra de inicio del iPhone */
    transform: translate(-50%, 140%);
    background: #fff;
    color: #1a0b2e;
    padding: 12px 20px;
    border-radius: 22px;
    width: max-content;            /* sin esto, en celular el aviso queda angosto (la mitad de la pantalla) */
    font-weight: 900;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    transition: transform 0.3s, opacity 0.3s;
    opacity: 0;
    pointer-events: none;
    z-index: 10;
    max-width: calc(100vw - 32px);
    text-align: center;
  }
  .aviso.visible { transform: translate(-50%, 0); opacity: 1; }

  /* Texto sólo para lectores de pantalla (personas ciegas) */
  .solo-lector { position: absolute; top: 0; left: 0; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* En pantallas angostas: el resultado final va en una sola columna */
  @media (max-width: 760px) {
    .final-grid { grid-template-columns: 1fr; gap: 10px; }
  }
  /* En celular: todo un poco más compacto */
  @media (max-width: 600px) {
    .app { --margen-arriba: 8px; --margen-lados: 12px; --margen-abajo: 10px; gap: 6px; }
    header h1 { font-size: clamp(1.5rem, 7vw, 2.2rem); text-shadow: 2px 2px 0 var(--acento), 4px 4px 0 var(--acento-2); }   /* cabe en una línea */
    header p { font-size: 0.82rem; }
    .juego { gap: 6px; }
    .hud { padding: 5px 6px 5px 8px; gap: 6px; }
    .paso { height: 30px; font-size: 0.95rem; }
    .tarjeta { padding: 14px 12px 16px; }
    .tarjeta.final { padding: 12px 12px 14px; }
    .btn.grande { font-size: 1.05rem; padding: 12px 20px; }
    .tablero { padding: 8px 8px 10px; gap: 6px; }
    .tablero-barra b { font-size: 1.25rem; }
    .opciones { gap: 8px; }
    .opcion { min-height: 58px; font-size: 1.02rem; padding: 8px 8px; }
    .acciones { gap: 8px; margin-top: 10px; }
    .acciones .btn { padding: 11px 14px; }
    .frase-final { font-size: 1.08rem; }
    .fila { grid-template-columns: minmax(0, 9.6em) minmax(0, 1fr) 2.2em; gap: 8px; }
    .final .acciones .btn { font-size: 0.95rem; padding: 10px 12px; }
    /* los 4 botones del final en 2 filas de 2, estirados para llenar el ancho (más ordenado y más bajo) */
    .tarjeta.final .acciones { margin: 6px -12px -14px; padding: 16px 12px 12px; }
    .final .acciones .btn { flex: 1 1 auto; white-space: nowrap; }
    .texto-largo { display: none; }
    .texto-corto { display: inline; }
    .final .descripcion { font-size: 0.92rem; }
    .pregunta { font-size: clamp(1.3rem, 6vw, 1.7rem); }
  }
  /* Pantallas no muy altas: se esconde el subtítulo para que las pruebas tengan más espacio.
     🔧 Cambia 700px si quieres que el subtítulo se vea en más (o menos) pantallas. */
  @media (max-height: 700px) {
    header p { display: none; }
    .lista-pruebas { gap: 4px; margin-bottom: 10px; }
    .lista-pruebas li { padding: 4px 10px; }
    .tarjeta h2 { margin-bottom: 4px; }
  }
  /* Pantallas bajitas (celular acostado): sin encabezado, y la pantalla de inicio
     muestra el título dentro de la tarjeta para que todos los botones quepan */
  @media (max-height: 500px) {
    header { display: none; }
    .app { --margen-arriba: 6px; --margen-abajo: 6px; gap: 6px; }
    .titulo-compacto {
      display: block; margin: 0 0 6px; color: #fff;
      font: 400 1.7rem/1.05 var(--fuente-titulo); letter-spacing: 2px;
      text-shadow: 2px 2px 0 var(--acento), 4px 4px 0 var(--acento-2);
    }
    #inicioTitulo { display: none; }
    .tarjeta { width: min(100%, 640px); padding: 10px 14px 12px; }
    .lista-pruebas { grid-template-columns: 1fr 1fr; }
    .emoji-grande { font-size: 2.4rem; }
    .acciones { margin-top: 8px; }
    .tarjeta p { margin: 4px 0; }
    .btn.grande { padding: 10px 22px; }
    .opciones { grid-template-columns: repeat(var(--opciones, 4), minmax(0, 1fr)); }   /* todas las respuestas en una fila */
    .opcion { min-height: 52px; }
    /* Resultado de cada prueba: sin el emoji grande ni "Prueba 1 de 5", para que "Siguiente prueba" quepa */
    #resEmoji, #resPaso { display: none; }
    .chip-edad { font-size: 1.3rem; margin: 4px 0 0; padding: 4px 16px; }
    /* Inicio: "Empezar" y "Sonido" en la misma fila, y el récord debajo */
    .fila-inicio { flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 0 10px; }
    .fila-inicio .record { order: 3; flex-basis: 100%; }
    /* Resultado final: siempre en 2 columnas, todo más compacto, y los botones en una sola fila */
    .final-grid { grid-template-columns: 1fr 1fr; gap: 6px 20px; }
    .tarjeta.final { padding: 10px 16px 12px; }
    .edad-grande { font-size: 4rem; margin: 0 0 2px; }
    .frase-final { font-size: 1rem; }
    .final .descripcion { font-size: 0.85rem; }
    .insignia { margin-top: 2px !important; padding: 2px 12px; }
    .desglose { gap: 4px; }
    .fila-edad { font-size: 1.3rem; }
    .poderes { margin-top: 6px !important; font-size: 0.92rem; }
    .tarjeta.final .acciones { display: flex; flex-wrap: nowrap; margin: 4px -16px -12px; padding: 12px 16px 8px; }
    .final .acciones .btn { padding: 9px 14px; font-size: 0.92rem; white-space: nowrap; }
  }
  /* Con pantalla táctil no hay teclado: no se muestran los atajos de teclas */
  @media (hover: none) {
    .atajos, .opcion .num { display: none; }
  }

  /* Respeta a quien prefiere menos animaciones: sin temblores, destellos ni saltos */
  @media (prefers-reduced-motion: reduce) {
    .temblando, .destello.activo, .flotante.activo, .ficha.tocada, .nueva, .cuenta-numero.pop, .emoji-grande { animation: none; }
    .btn, .aviso, .ficha, .opcion, .paso, .revelable, .fila-barra span { transition: none; }
    .ficha.encendida { transform: none; }
    .revelable { opacity: 1; transform: none; }
  }

/* ===== Botón "¡Aquí hay más!" abajo a la derecha, con el logo WF ===== */
/* CAMBIAR: 56px = tamaño del botón; 12px = distancia a los bordes; 118% = zoom del logo (la imagen wf.png vive en el repo wafflefun.github.io) */
.ma-b {
  left: auto !important; top: auto !important; transform: none !important;
  right: 12px !important;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 12px) !important;
  width: 56px !important; height: 56px !important; min-width: 0 !important; padding: 0 !important;
  border: none !important; border-radius: 50% !important;
  font-size: 0 !important; line-height: 0 !important; color: transparent !important;
  background: url("https://wafflefun.github.io/wf.png") center / 118% no-repeat !important;
  box-shadow: 0 4px 10px rgba(0, 0, 0, .4) !important;
}
.ma-b > * { display: none !important; }
/* Solo se ve en el inicio y en el resultado final (no estorba en las pruebas) */
body:not(.con-boton) .ma-b { display: none !important; }
/* Deja espacio abajo para que el botón no tape los botones del juego */
body.con-boton .app { --margen-abajo: 74px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <!-- 🔧 TEXTOS: el título y el subtítulo se escriben desde el objeto TEXTOS -->
    <h1 id="titulo"></h1>
    <p id="subtitulo"></p>
  </header>

  <main class="juego" id="juego">
    <!-- HUD: progreso de las pruebas (una pastilla por prueba), sonido e inicio -->
    <div class="hud" id="hud">
      <ol class="pasos" id="pasos"></ol>
      <button class="btn icono" id="btnSonido" type="button"></button>
      <button class="btn icono" id="btnCasa" type="button" hidden></button>
    </div>

    <div class="zona" id="zona">
      <!-- (1) Pantalla de inicio -->
      <section class="pantalla" id="pantallaInicio" aria-labelledby="inicioTitulo">
        <div class="tarjeta">
          <p class="titulo-compacto" id="tituloCompacto" aria-hidden="true"></p>
          <h2 id="inicioTitulo"></h2>
          <ul class="lista-pruebas" id="listaPruebas"></ul>
          <div class="fila-inicio">
            <button class="btn principal grande" id="btnEmpezar" type="button" data-principal></button>
            <p class="record" id="textoRecord"></p>
            <button class="btn" id="btnSonidoInicio" type="button"></button>
          </div>
          <p class="atajos" id="textoAtajos"></p>
        </div>
      </section>

      <!-- (2) Instrucciones de cada prueba -->
      <section class="pantalla" id="pantallaIntro" aria-labelledby="introNombre" hidden>
        <div class="tarjeta">
          <p class="paso-num" id="introPaso"></p>
          <div class="emoji-grande" id="introEmoji" aria-hidden="true"></div>
          <h2 id="introNombre"></h2>
          <p class="mide" id="introMide"></p>
          <p class="instruccion" id="introInstrucciones"></p>
          <p class="atajos" id="introTeclado"></p>
          <button class="btn principal grande" id="btnListo" type="button" data-principal></button>
        </div>
      </section>

      <!-- (3) Cuenta regresiva 3-2-1 -->
      <section class="pantalla" id="pantallaCuenta" hidden>
        <div class="cuenta">
          <p class="cuenta-prueba" id="cuentaPrueba"></p>
          <span class="cuenta-numero" id="cuentaNumero" aria-hidden="true"></span>
          <p class="sub" id="cuentaTexto"></p>
        </div>
      </section>

      <!-- (4) La prueba (cada prueba dibuja lo suyo dentro de "areaPrueba") -->
      <section class="pantalla pantalla-prueba" id="pantallaPrueba" hidden>
        <div class="tablero" id="tablero" tabindex="-1">
          <div class="tablero-barra">
            <b id="pruebaNombre"></b>
            <span id="pruebaEstado"></span>
            <span id="pruebaTiempo"></span>
          </div>
          <div class="barra-tiempo" id="barraTiempo" aria-hidden="true" hidden><span id="barraTiempoRelleno"></span></div>
          <div class="area-prueba" id="areaPrueba"></div>
          <div class="destello" id="destello" aria-hidden="true"></div>
          <div class="sello" id="sello" hidden></div>
        </div>
      </section>

      <!-- (5) Resultado de una prueba -->
      <section class="pantalla" id="pantallaResultado" aria-labelledby="resTitulo" hidden>
        <div class="tarjeta">
          <p class="paso-num" id="resPaso"></p>
          <div class="emoji-grande" id="resEmoji" aria-hidden="true"></div>
          <h2 id="resTitulo"></h2>
          <p class="res-linea" id="resLinea"></p>
          <p class="res-detalle" id="resDetalle"></p>
          <span class="chip-edad" id="resEdad"></span>
          <p class="sub" id="resComentario"></p>
          <div class="acciones">
            <button class="btn principal grande" id="btnSiguientePrueba" type="button" data-principal></button>
            <button class="btn" id="btnRepetirPrueba" type="button" hidden></button>
          </div>
        </div>
      </section>

      <!-- (6) Resultado final -->
      <section class="pantalla" id="pantallaFinal" aria-labelledby="finalEtiqueta" hidden>
        <div class="tarjeta final">
          <div class="final-grid">
            <div>
              <span class="etiqueta" id="finalEtiqueta"></span>
              <div class="edad-grande" aria-hidden="true"><span id="finalEdad">0</span><small id="finalAnos"></small></div>
              <p class="frase-final revelable" id="finalFrase"></p>
              <p class="descripcion revelable" id="finalDescripcion"></p>
              <p class="nuevo-record revelable" id="finalRecord" hidden></p>
              <p class="insignia revelable" id="finalRobot" hidden></p>
            </div>
            <!-- "revelable": el desglose aparece cuando el número termina de subir (no antes, para no arruinar la sorpresa) -->
            <div class="revelable">
              <span class="etiqueta" id="desgloseTitulo"></span>
              <ul class="desglose" id="desglose"></ul>
              <p class="poderes revelable"><span id="superPoder"></span><span id="aEntrenar"></span></p>
            </div>
          </div>
          <!-- data-principal: el botón que recibe el foco al aparecer la pantalla. Aquí es Compartir y no
               "Jugar de nuevo", para que un Enter de más no borre el resultado antes de verlo. -->
          <div class="acciones">
            <button class="btn secundario" id="btnCompartir" type="button" data-principal></button>
            <button class="btn" id="btnDescargar" type="button"></button>
            <button class="btn principal" id="btnOtra" type="button"></button>
            <button class="btn" id="btnInicio" type="button"></button>
          </div>
        </div>
      </section>

      <!-- (7) Pausa: aparece ENCIMA de la prueba si cambias de pestaña -->
      <section class="pantalla pausa" id="pantallaPausa" aria-labelledby="pausaTitulo" hidden>
        <div class="tarjeta">
          <h2 id="pausaTitulo"></h2>
          <p class="sub" id="pausaTexto"></p>
          <button class="btn principal grande" id="btnSeguir" type="button"></button>
        </div>
      </section>
    </div>
  </main>
</div>

<div class="aviso" id="aviso" role="status"></div>
<!-- Aquí se "anuncian" los mensajes para lectores de pantalla -->
<div class="solo-lector" id="anuncio" aria-live="polite"></div>

<script>
'use strict';

/* =====================================================================
   🔧 CONFIG — ajustes generales del juego
   (cada prueba tiene además su propia sección más abajo:
    🔧 REFLEJOS, 🔧 MEMORIA, 🔧 VISTA, 🔧 LÓGICA, 🔧 CONCENTRACIÓN)
   ===================================================================== */
const CONFIG = {
  // 📤 COMPARTIR
  MARCA: 'noparess · Tu edad mental',                      // texto chico al pie de la imagen del resultado
  URL_COMPARTIR: 'https://wafflefun.github.io/noparess/',  // link que se comparte junto al resultado

  // 🔊 SONIDO (ver también 🔧 SONIDOS)
  SONIDO: true,            // true = la primera vez el sonido parte encendido; false = parte apagado (el jugador lo puede prender)
  VOLUMEN: 0.25,           // volumen general: 0 = mudo, 1 = máximo

  // ⏱️ TIEMPOS generales (en milisegundos: 1000 = 1 segundo).
  //    Los tiempos de cada prueba están dentro de su sección (busca ⏱️ más abajo).
  CUENTA_DESDE: 3,         // números de la cuenta regresiva antes de cada prueba (3 = "3, 2, 1")
  CUENTA_PASO: 800,        // ms que dura cada número de la cuenta regresiva
  PAUSA_FIN_PRUEBA: 750,   // ms que se ve el sello "¡Tiempo!" o "¡Listo!" antes del resultado de la prueba
  TIEMPO_CONTADOR: 1800,   // ms que tarda el número del final en "subir" hasta tu edad

/* =====================================================================
   🔧 EDADES — cómo se convierte cada puntaje en años
   ---------------------------------------------------------------------
   En palabras simples:
     1. Cada prueba tiene dos puntajes de referencia en su sección:
        EXCELENTE (lo que haría un crack) y MALO (lo que haría alguien
        muy malo). Busca EXCELENTE con Ctrl+F para verlos todos.
     2. Se mira dónde quedó tu puntaje entre esos dos, de 0 a 1:
          nota = (tu puntaje − MALO) ÷ (EXCELENTE − MALO)
        (si te pasas de EXCELENTE vale 1; si estás bajo MALO vale 0)
     3. La nota se "curva" con CURVA (elevar a una potencia): con menos
        de 1, a la gente promedio le toca una edad un poco más joven.
        (No conviene bajarla mucho de 0.7: con 0.5 o menos, sacar 1 punto
        más que MALO ya baja la edad unos 20 años de golpe.)
     4. edad = EDAD_PEOR − nota curvada × (EDAD_PEOR − EDAD_MEJOR)
        y se le suma un poquito de azar (± AZAR años) para que dos
        partidas iguales no den exactamente lo mismo.
     5. La edad FINAL es el promedio de las edades de cada prueba,
        usando el "peso" de cada una (ver 🔧 PRUEBAS).
     6. "Tu súper poder" y "A entrenar" se eligen por la nota (sin el
        azar): la prueba con la nota más alta y la más baja.

   EJEMPLO con números (Reflejos: EXCELENTE 220 ms, MALO 550 ms, CURVA 0.7):
     Si tu promedio fue 330 ms:
       nota = (330 − 550) ÷ (220 − 550) = −220 ÷ −330 = 0,67
       nota curvada = 0,67 elevado a 0,7 = 0,75
       edad = 95 − 0,75 × (95 − 18) = 95 − 58 = 37 años (± 2 de azar)
     Si fue 220 ms o menos → nota 1 → 18 años. Si fue 550 o más → 95 años.
     Y en una prueba donde MÁS es mejor (Memoria: EXCELENTE 8, MALO 2),
     una secuencia de 6 da: nota = (6 − 2) ÷ (8 − 2) = 0,67 → también 37 años.

   TABLA sin azar (con los valores de este archivo):
     Reflejos (ms):    250→23  300→32  330→37  400→51  450→62  500→74
     Memoria (largo):  3→73    4→59    5→48    6→37    7→27    8→18
     Vista:            2→81    4→64    6→51    8→39    10→28   12→18
     Lógica (puntos):  1→80    2→70    4→54    6→41    8→29    10→18
     Concentración:    1→83    2→75    4→63    6→52    10→34   14→18

   CALIBRACIÓN (probada con jugadores-robot automáticos, partidas completas
   a velocidad normal, con los valores de este archivo):
     • Robot PERFECTO (todo bien y rápido)              → 18 a 19 años (6 partidas)
     • Robot PROMEDIO (≈65 % bien, reflejos ≈330 ms)    → 34 a 54 años (11 partidas, en
                                                          promedio 44; 2 de 11 pasaron de 50)
     • Robot MALO que no toca nada                      → 94 a 95 años
     • Robot MALO que toca al azar                      → 84 a 95 años (en promedio 92)
     • Tocar al azar LO MÁS RÁPIDO POSIBLE en Lógica    → 0 puntos en 4 de 5 intentos (95 años);
                                                          con mucha suerte, 3 puntos (61 años)
   (El robot PROMEDIO varía bastante porque en Concentración un 65 % de
    aciertos da desde 0 hasta 15 puntos según la suerte.)
   Si la gente dice que le sale "muy viejo": baja CURVA (por ejemplo a 0.6)
   o baja los EXCELENTE. Si le sale "muy joven": sube CURVA (por ejemplo a
   0.8) o sube los EXCELENTE. Cambia de a poco y prueba varias veces.
   ===================================================================== */
const EDADES = {
  EDAD_MEJOR: 18,          // años que da una prueba hecha a nivel EXCELENTE. Si la bajas de 18, baja también
                           //    EDAD_MINIMA_MOSTRADA (si no, se sigue mostrando 18 como mínimo)
  EDAD_PEOR: 95,           // años que da una prueba hecha a nivel MALO (o peor). Si la subes de 99, sube
                           //    también EDAD_MAXIMA_MOSTRADA (si no, se sigue mostrando 99 como máximo)
  CURVA: 0.7,              // 1 = parejo; menos de 1 = más generoso con los del medio; más de 1 = más exigente
  AZAR: 2,                 // años de azar que se suman o restan a cada prueba (0 = sin azar)
  EDAD_MINIMA_MOSTRADA: 18,// nunca se muestra una edad menor que esta (ni en cada prueba ni en el final)
  EDAD_MAXIMA_MOSTRADA: 99,// ni mayor que esta
};

    { frecuencia: 784, duracion: 0.14, tipo: 'triangle', volumen: 0.8, retraso: 0.24 },
    { frecuencia: 1047, duracion: 0.55, tipo: 'triangle', volumen: 0.8, retraso: 0.36 },
    { frecuencia: 784, duracion: 0.55, tipo: 'sine', volumen: 0.4, retraso: 0.36 },
  ],
  TIC: [{ frecuencia: 1800, duracion: 0.025, tipo: 'square', volumen: 0.12 }],               // el contador de edad subiendo
  BOTON: [{ frecuencia: 660, duracion: 0.07, tipo: 'triangle', volumen: 0.4 }],              // al prender el sonido
  // 🧩 Memoria: cada casilla tiene su nota (Hz), de la 1.ª a la 9.ª (de izquierda a derecha y de arriba abajo)
  NOTAS_MEMORIA: [262, 294, 330, 349, 392, 440, 494, 523, 587],
  NOTA_MEMORIA: { duracion: 0.22, tipo: 'triangle', volumen: 0.6 },
  // 💡 IDEA: música de fondo suave durante las pruebas: un bucle de notas con setInterval que
  //          llame a tono(), y que se detenga en limpiarPrueba().
};


/* =====================================================================
   De aquí para abajo está la "maquinaria" del juego.
   Normalmente no hace falta tocarla, pero también tiene notas.
   ===================================================================== */

// ---------- Estado del juego ----------
// "estado" dice en qué momento estamos. Sólo puede ser uno de estos:
//   'inicio'          → pantalla de inicio
//   'intro'           → instrucciones de una prueba (botón "¡Listo!")
//   'cuenta'          → cuenta regresiva 3-2-1
//   'prueba'          → jugando una prueba
//   'resultadoPrueba' → resultado de la prueba que acaba de terminar
//   'final'           → resultado final con tu edad mental
//   'pausa'           → cambiaste de pestaña en medio de una prueba
let estado = 'inicio';
let estadoAntesDePausa = null;
let listaPruebas = [];             // las pruebas de esta partida (las activas, o sólo la de ?prueba=)
let indicePrueba = 0;              // cuál de listaPruebas va ahora (0 = la primera)
let pruebaActual = null;
let control = null;                // lo que devuelve empezar() de la prueba (pista, pausar, reanudar, tecla)
let cronActual = null;             // el cronómetro de la prueba (si tiene)
let turnoPrueba = 0;               // sube cada vez que empieza o se abandona una prueba (así nada viejo se cuela)
let crudos = {}, edades = {}, detalles = {};   // puntaje, edad y detalle de cada prueba ({ reflejos: 245, … })
let notas = {};                    // la nota de 0 a 1 de cada prueba, SIN azar (para elegir súper poder / a entrenar)
let edadFinal = null;
let esRecordActual = false;
let pruebaForzada = null;          // la prueba de ?prueba= en la dirección
let rapido = false;                // true con ?rapido=1
let FACTOR = 1;                    // por cuánto se dividen los tiempos (4 con ?rapido=1)
let record = leerRecord();
let silencio = leerSilencio();
let audio = null;
let momentoPantalla = -Infinity;   // cuándo apareció la pantalla actual (para CONFIG.BLOQUEO_TOQUE)
let momentoCasa = -Infinity;       // cuándo se tocó 🏠 por primera vez (para pedir el segundo toque)

// ---------- Elementos de la página ----------
const $ = (id) => document.getElementById(id);
const FUENTE_EMOJI = '"Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif';
const PANTALLAS = ['pantallaInicio', 'pantallaIntro', 'pantallaCuenta', 'pantallaPrueba', 'pantallaResultado', 'pantallaFinal'];

// ---------- Utilidades ----------
const limitar = (v, min, max) => Math.max(min, Math.min(max, v));
const azarEntero = (min, max) => min + Math.floor(Math.random() * (max - min + 1));   // número al azar entre min y max (ambos incluidos)
const menosMovimiento = () => !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
const dur = (ms) => ms / FACTOR;   // con ?rapido=1 los tiempos se dividen por CONFIG.FACTOR_RAPIDO

// Desordena una lista (la cambia y la devuelve)
// 💡 IDEA: DESAFÍO DEL DÍA: usar aquí un azar con "semilla" (la fecha de hoy) en vez de Math.random,
//          para que todos los que juegan el mismo día vean las mismas preguntas, secuencias y pares,
//          y puedan compararse de igual a igual.
function mezclar(lista) {
  for (let i = lista.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [lista[i], lista[j]] = [lista[j], lista[i]];
  }
  return lista;
}

// Reemplaza {etiquetas} de una plantilla: rellenar('Hola {quien}', { quien: 'Ana' }) → 'Hola Ana'
function rellenar(plantilla, datos) {
  return plantilla
    .replace(/\{(\w+)\}/g, (todo, clave) => (clave in datos ? String(datos[clave]) : todo))
    .replace(/\bde el\b/g, 'del')
    .replace(/\ba el\b/g, 'al');
}

function ponerTexto(el, texto) { if (el.textContent !== texto) el.textContent = texto; }


/* =====================================================================
   RELOJES — todos los "después de X ms" de una prueba pasan por aquí.
   Así, cuando la prueba termina (o vuelves al inicio), se borran TODOS
   de una vez y ninguno se cuela en la prueba siguiente.
   ===================================================================== */
function crearReloj() {
  let turno = 0;                       // si cambia, los relojes viejos ya no hacen nada
  const esperas = new Set(), cuadros = new Set();
  return {
    // Hace "funcion" dentro de "ms" milisegundos
    despues(funcion, ms) {
      const miTurno = turno;
      const id = setTimeout(() => {
        esperas.delete(id);
        if (miTurno === turno) funcion();
      }, Math.max(0, ms));
      esperas.add(id);
      return id;
    },
    cancelar(id) { clearTimeout(id); esperas.delete(id); },
    // Hace "funcion" en cada cuadro de la pantalla (~60 por segundo) hasta que devuelva false
    cadaCuadro(funcion) {
      const miTurno = turno;
      let id = 0;
      const paso = (ahora) => {
        cuadros.delete(id);
        if (miTurno !== turno || funcion(ahora) === false) return;
        id = requestAnimationFrame(paso);
        cuadros.add(id);
      };
      id = requestAnimationFrame(paso);
      cuadros.add(id);
    },
    limpiar() {
      turno++;
      esperas.forEach(clearTimeout);
      esperas.clear();
      cuadros.forEach(cancelAnimationFrame);
      cuadros.clear();
    },
    pendientes: () => esperas.size + cuadros.size,
  };
}
const relojPrueba = crearReloj();    // los tiempos de la prueba que se está jugando
const relojCrono = crearReloj();     // la barra de tiempo de la prueba
const relojPantalla = crearReloj();  // cuenta regresiva, sello de fin, contador del final

function limpiarPrueba() {
  relojPrueba.limpiar();
  relojCrono.limpiar();
  cronActual = null;
  control = null;
}

// Cronómetro con barra: se congela en la pausa y se puede "castigar" (restar segundos)
function crearCronometro(segundos, alTerminar) {
  relojCrono.limpiar();
  const total = (segundos * 1000) / FACTOR;
  let gastado = 0, desde = performance.now(), pausado = false, castigo = 0;
  const barra = $('barraTiempo'), relleno = $('barraTiempoRelleno'), texto = $('pruebaTiempo');
  barra.hidden = false;
  const c = {
    restante() {
      const corriendo = pausado ? 0 : performance.now() - desde;
      return Math.max(0, total - gastado - corriendo - castigo);
    },
    pausar() { if (!pausado) { gastado += performance.now() - desde; pausado = true; } },
    reanudar() { if (pausado) { desde = performance.now(); pausado = false; } },
    castigar(seg) { castigo += (seg * 1000) / FACTOR; },
  };
  cronActual = c;
  const dibujar = () => {
    const r = c.restante();
    relleno.style.width = ((r / total) * 100).toFixed(2) + '%';
    const poco = r <= (CONFIG.ULTIMOS_SEGUNDOS * 1000) / FACTOR;
    barra.classList.toggle('poco', poco);
    texto.classList.toggle('tiempo-poco', poco);
    ponerTexto(texto, TEXTOS.TIEMPO(Math.ceil(r / 1000)));
    return r;
  };
  dibujar();
  relojCrono.cadaCuadro(() => {
    const r = dibujar();
    if (r <= 0 && !pausado) { alTerminar(); return false; }
    return true;
  });
  return c;
}


/* =====================================================================
   LO QUE CADA PRUEBA PUEDE USAR ("juego")
   ===================================================================== */
function crearJuego(prueba, token) {
  const activa = () => estado === 'prueba' && turnoPrueba === token;
  return {
    area: $('areaPrueba'),
    config: prueba.config || {},
    activa,                                                      // true mientras se aceptan toques
    // sello (opcional): el cartel que sale al terminar; si no se pone, "¡Listo!" o "¡Tiempo!"
    terminar: (valor, detalle, sello) => terminarPrueba(token, valor, detalle, sello),
    // sinAcelerar = true: este tiempo NO se divide con ?rapido=1
    despues: (funcion, ms, sinAcelerar) => relojPrueba.despues(funcion, sinAcelerar ? ms : dur(ms)),
    cancelar: (id) => relojPrueba.cancelar(id),
    limpiarTodo: () => relojPrueba.limpiar(),                    // borra los "después" pendientes (no el cronómetro)
    alProximoCuadro: (funcion) => relojPrueba.cadaCuadro((t) => { funcion(t); return false; }),
    estado: (texto) => ponerTexto($('pruebaEstado'), texto),
    cronometro: (segundos, alTerminar) => crearCronometro(segundos, alTerminar),
    sonar: (nombre) => sonar(SONIDOS[nombre] || []),
    nota: (i) => tonoMemoria(i),
    sacudir: (el) => sacudir(el || $('tablero')),
    destello: destellar,
    anunciar,
    boton(texto, alTocar) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'btn principal grande';
      b.style.margin = 'auto';
      b.textContent = texto;
      b.addEventListener('click', () => { if (activa()) alTocar(); });
      $('areaPrueba').appendChild(b);
      return b;
    },
  };
}


/* =====================================================================
   PRUEBA ⚡ REFLEJOS  (ajustes en 🔧 REFLEJOS)
   ===================================================================== */
function empezarReflejos(juego) {
  const C = CONFIG.REFLEJOS;
  const resultados = [];             // { ms, tipo: 'ok' | 'castigo' | 'lento' } de cada ronda
  let ronda = 0;                     // rondas ya terminadas
  let prontos = 0, prontosTotal = 0; // veces "muy pronto" en esta ronda / en total
  let fase = 'entre';                // 'espera' (rojo) | 'ya' (verde) | 'pronto' (naranja) | 'entre' (mostrando tu tiempo)
  let momentoVerde = 0;
  let idVerde = null, idLimite = null;

  juego.area.innerHTML = `
    <div class="zona-reflejos entre" id="zonaReflejos" tabindex="-1">
      <span class="zr-grande" id="zrGrande"></span>
      <span class="zr-chica" id="zrChica"></span>
    </div>
    <ol class="rondas" id="rondas"></ol>`;
  const zona = $('zonaReflejos');
  // pointerdown (y no "click"): reacciona en cuanto el dedo o el mouse BAJA, sin esperar a que suba
  zona.addEventListener('pointerdown', (e) => {
    if (!e.isPrimary || e.button > 0) return;
    e.preventDefault();
    tocar(e.timeStamp);
  });

  // Cambia el color de la zona (sin borrar otras clases, como la del temblor)
  function pintar(clase, grande, chica) {
    zona.classList.remove('entre', 'espera', 'ya', 'pronto');
    zona.classList.add(clase);
    ponerTexto($('zrGrande'), grande);
    ponerTexto($('zrChica'), chica);
  }
  function pintarRondas() {
    const ol = $('rondas');
    ol.textContent = '';
    for (let i = 0; i < C.RONDAS; i++) {
      const li = document.createElement('li');
      const r = resultados[i];
      li.textContent = TEXTOS.REFLEJOS_FICHA(i + 1, r ? TEXTOS.REFLEJOS_MS(r.ms) : '—');
      if (r && r.tipo !== 'ok') li.className = 'castigo';
      else if (i === ronda && fase !== 'entre') li.className = 'actual';
      ol.appendChild(li);
    }
  }
  function cancelarRonda() {
    juego.cancelar(idVerde);
    juego.cancelar(idLimite);
  }
  function empezarRonda() {
    cancelarRonda();
    fase = 'espera';
    pintar('espera', TEXTOS.REFLEJOS_ESPERA, TEXTOS.REFLEJOS_ESPERA_SUB);
    juego.estado(TEXTOS.REFLEJOS_RONDA(ronda + 1, C.RONDAS));
    pintarRondas();
    const espera = C.ESPERA_MIN + Math.random() * (C.ESPERA_MAX - C.ESPERA_MIN);
    idVerde = juego.despues(ponerVerde, espera);
  }
  function ponerVerde() {
    fase = 'ya';
    pintar('ya', TEXTOS.REFLEJOS_YA, TEXTOS.REFLEJOS_YA_SUB);
    juego.sonar('YA');
    anunciar(TEXTOS.REFLEJOS_YA);
    momentoVerde = performance.now();
    // El verde se ve en pantalla en el próximo cuadro: se mide desde ahí (es más justo)
    juego.alProximoCuadro((t) => { if (fase === 'ya' && t > momentoVerde) momentoVerde = t; });
    // Este límite es tiempo real: no se divide con ?rapido=1
    idLimite = juego.despues(() => registrar(C.LIMITE, 'lento'), C.LIMITE, true);
  }
  function tocar(momento) {
    if (!juego.activa()) return;
    if (fase === 'espera') { temprano(false); return; }
    if (fase !== 'ya') return;                       // mostrando un mensaje: no cuenta
    let ms = momento - momentoVerde;
    if (!(ms > -50 && ms < 60000)) ms = performance.now() - momentoVerde;   // por si el navegador da una hora rara
    if (ms < C.MINIMO_HUMANO) { temprano(true); return; }
    registrar(Math.round(ms), 'ok');
  }
  function temprano(adivino) {
    cancelarRonda();
    prontos++;
    prontosTotal++;
    juego.sonar('MAL');
    vibrar();
    if (prontos >= C.MAX_PRONTOS) registrar(C.CASTIGO_PRONTO, 'castigo');
    else {
      fase = 'pronto';
      const sub = adivino ? TEXTOS.REFLEJOS_ADIVINO_SUB : TEXTOS.REFLEJOS_PRONTO_SUB;
      pintar('pronto', TEXTOS.REFLEJOS_PRONTO, sub);
      anunciar(`${TEXTOS.REFLEJOS_PRONTO} ${sub}`);
      juego.despues(empezarRonda, C.PAUSA_PRONTO);
    }
    juego.sacudir(zona);                             // el temblor va DESPUÉS de pintar la zona
  }
  function registrar(ms, tipo) {
    cancelarRonda();
    resultados.push({ ms, tipo });
    ronda++;
    prontos = 0;
    fase = 'entre';
    if (tipo === 'ok') { pintar('entre', TEXTOS.REFLEJOS_MS(ms), TEXTOS.REFLEJOS_BUENO_SUB); juego.sonar('BIEN'); anunciar(TEXTOS.REFLEJOS_MS(ms)); }
    else if (tipo === 'lento') { pintar('entre', TEXTOS.REFLEJOS_LENTO, TEXTOS.REFLEJOS_LENTO_SUB(ms)); juego.sonar('MAL'); anunciar(`${TEXTOS.REFLEJOS_LENTO} ${TEXTOS.REFLEJOS_LENTO_SUB(ms)}`); }
    else { pintar('entre', TEXTOS.REFLEJOS_CASTIGO, TEXTOS.REFLEJOS_CASTIGO_SUB(ms)); anunciar(`${TEXTOS.REFLEJOS_CASTIGO}. ${TEXTOS.REFLEJOS_CASTIGO_SUB(ms)}`); }
    pintarRondas();
    juego.despues(ronda >= C.RONDAS ? terminar : empezarRonda, C.PAUSA_ENTRE_RONDAS);
  }
  function terminar() {
    const promedio = Math.round(resultados.reduce((s, r) => s + r.ms, 0) / Math.max(1, resultados.length));
    const lista = resultados.map((r) => (r.tipo === 'ok' ? '' : TEXTOS.REFLEJOS_CASTIGADA_ICONO) + TEXTOS.REFLEJOS_MS(r.ms));
    juego.terminar(promedio, TEXTOS.REFLEJOS_DETALLE(lista, prontosTotal));
  }

  empezarRonda();
  return {
    foco: zona,
    pista: () => ({ fase }),
    // Pausa: la ronda que iba se borra y al volver empieza de nuevo.
    // (Lo que devuelve pausar() se muestra en la tarjeta de pausa.)
    pausar() {
      juego.limpiarTodo();
      fase = 'entre';
      pintar('entre', TEXTOS.PAUSA_TITULO, TEXTOS.REFLEJOS_PAUSA_SUB);
      return TEXTOS.REFLEJOS_PAUSA_SUB;
    },
    reanudar() { if (ronda >= C.RONDAS) terminar(); else empezarRonda(); },
    tecla(e) {
      if (e.key !== ' ' && e.key !== 'Enter') return;
      e.preventDefault();
      if (!e.repeat) tocar(e.timeStamp);
    },
  };
}


// Flechas del teclado para moverse entre los emojis de una cuadrícula (Memoria y Vista)
function flechasCuadricula(cuad) {
  cuad.addEventListener('keydown', (e) => {
    if (!['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) return;
    const fichas = [...cuad.querySelectorAll('.ficha')];
    const actual = fichas.indexOf(document.activeElement);
    if (actual < 0) return;
    e.preventDefault();
    const columnas = Math.round(Math.sqrt(fichas.length)) || 1;   // las cuadrículas son cuadradas
    const salto = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -columnas, ArrowDown: columnas }[e.key];
    const destino = fichas[actual + salto];
    if (destino) destino.focus();
  });
}


/* =====================================================================
   PRUEBA 🧩 MEMORIA  (ajustes en 🔧 MEMORIA)
   ===================================================================== */
function empezarMemoria(juego) {
  const C = CONFIG.MEMORIA;
  const emojis = mezclar(EMOJIS_MEMORIA.slice()).slice(0, 9);
  let largo = C.INICIO;        // largo de la secuencia actual
  let vidas = C.VIDAS;
  let mejor = 0;               // largo más largo completado
  let errores = 0;
  let secuencia = [];          // números de casilla (0 a 8) en orden
  let progreso = 0;            // cuántas casillas de la secuencia ya tocaste bien
  let fase = 'entre';          // 'mostrando' | 'entrada' (tu turno) | 'entre' (mensaje) | 'fin'
  let idEspera = null;

  juego.area.innerHTML = `
    <p class="mensaje-prueba" id="msgMemoria" aria-live="polite"></p>
    <div class="caja-cuadricula"><div class="cuadricula" id="cuadMemoria"></div></div>`;
  const cuad = $('cuadMemoria');
  const fichas = emojis.map((emo, i) => {
    const b = document.createElement('button');
    b.type = 'button';
